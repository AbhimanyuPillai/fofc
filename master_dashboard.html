<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-root: #000000;
      --bg-panel: #050505;
      --bg-card: #080808;
      --bg-control: #0d0d0d;
      --border-subtle: #161616;
      --border-mid: #222222;
      --border-active: #333333;
      --text-main: #e5e5e5;
      --text-secondary: #888888;
      --text-muted: #666666;
      --text-dim: #444444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-root);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* TOP HEADER: MINIMALIST BRAND ONLY */
    header {
      height: 48px;
      min-height: 48px;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-root);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      background: var(--bg-control);
      border: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-main);
      stroke-width: 1.8;
    }

    .brand-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-main);
      text-transform: uppercase;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      padding: 0.85rem 1.25rem 0.85rem 1.25rem;
      gap: 0.85rem;
      overflow: hidden;
      background: var(--bg-root);
    }

    /* TOP ROW: DUAL VIDEO PANES (40% / 60%) */
    .top-panes-row {
      display: flex;
      height: 56%;
      min-height: 280px;
      gap: 0.85rem;
      width: 100%;
    }

    .pane-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-left-pane {
      flex: 0 0 calc(40% - 0.425rem);
      max-width: calc(40% - 0.425rem);
    }

    .top-right-pane {
      flex: 0 0 calc(60% - 0.425rem);
      max-width: calc(60% - 0.425rem);
    }

    .pane-header {
      height: 38px;
      min-height: 38px;
      padding: 0 0.85rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-transform: uppercase;
    }

    .pane-title svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
    }

    .pane-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    /* DECOUPLED DEVICE SELECTORS */
    .media-select {
      background: #0d0d0d;
      border: 1px solid #222222;
      color: #a0a0a0;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      max-width: 135px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .media-select:hover,
    .media-select:focus {
      border-color: #333333;
      color: #e5e5e5;
    }

    .media-select option {
      background: #0d0d0d;
      color: #e5e5e5;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 38px);
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .feed-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
      overflow: hidden;
    }

    /* BOTTOM PANE: HARDWARE TARGET & TERMINAL */
    .bottom-pane {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* SINGLE ACTIVE TARGET BAR */
    .active-target-bar {
      padding: 0.45rem 0.85rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.15s ease-out;
    }

    .active-target-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      padding: 3px 10px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }

    .active-target-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-main);
    }

    .active-target-name {
      color: var(--text-main);
      font-weight: 600;
    }

    .active-target-tag {
      color: var(--text-muted);
      font-size: 0.65rem;
      padding-left: 6px;
      border-left: 1px solid var(--border-subtle);
    }

    .active-target-status {
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* TERMINAL & DIALOGUE CONSOLE */
    .terminal-body {
      flex: 1;
      background: #000000;
      padding: 0.85rem 1.25rem;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 0.82rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Custom Scrollbar */
    .terminal-body::-webkit-scrollbar {
      width: 5px;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: #000000;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: #1c1c1c;
      border-radius: 3px;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: #2a2a2a;
    }

    /* Dialogue Message Cards */
    .dialogue-msg {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      padding: 0.55rem 0.85rem;
      border-radius: 4px;
      animation: fadeIn 0.15s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(2px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dialogue-msg.msg-user {
      align-self: flex-start;
      background: #080808;
      border: 1px solid var(--border-subtle);
      border-left: 2px solid #555555;
    }

    .dialogue-msg.msg-user .msg-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .dialogue-msg.msg-user .msg-sender-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dialogue-msg.msg-user .msg-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .dialogue-msg.msg-user .msg-body {
      color: #d4d4d4;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .dialogue-msg.msg-repos {
      align-self: flex-start;
      background: #080808;
      border: 1px solid var(--border-mid);
      border-left: 2px solid var(--text-secondary);
    }

    .dialogue-msg.msg-repos .msg-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .dialogue-msg.msg-repos .msg-sender-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dialogue-msg.msg-repos .msg-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .dialogue-msg.msg-repos .msg-body {
      color: var(--text-main);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    /* Muted Status Pill Badges Row */
    .status-pill-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 2px 0;
      animation: fadeIn 0.15s ease-out;
    }

    .dialogue-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .dialogue-pill .pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .dialogue-pill.pill-listening {
      border-color: var(--border-mid);
      color: var(--text-main);
    }

    .dialogue-pill.pill-listening .pill-dot {
      background: var(--text-main);
    }

    .dialogue-pill.pill-speaking {
      border-color: var(--border-active);
      color: #ffffff;
    }

    .dialogue-pill.pill-speaking .pill-dot {
      background: #ffffff;
    }

    .dialogue-pill.pill-thinking {
      border-color: var(--border-mid);
      color: var(--text-secondary);
    }

    .dialogue-pill.pill-thinking .pill-dot {
      background: var(--text-secondary);
    }

    .dialogue-pill.pill-target {
      border-color: var(--border-mid);
      color: var(--text-main);
    }

    .dialogue-pill.pill-target .pill-dot {
      background: var(--text-secondary);
    }

    .dialogue-pill.pill-system {
      border-color: var(--border-subtle);
      color: var(--text-muted);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .top-panes-row {
        flex-direction: column;
        height: auto;
      }

      .top-left-pane,
      .top-right-pane {
        flex: 1 1 100%;
        max-width: 100%;
        height: 260px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="brand-section">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <div class="brand-title">REPOS</div>
    </div>
  </header>

  <!-- 3-PANE MASTER LAYOUT -->
  <main>
    <!-- TOP ROW (40% / 60% DUAL VIDEO HUDS) -->
    <div class="top-panes-row">
      <!-- Top-Left Pane (40% width): REPOS 01 -->
      <div class="pane-card top-left-pane">
        <div class="pane-header">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M5.5 21a8.38 8.38 0 0 1 13 0"></path>
            </svg>
            REPOS 01
          </div>
          <div class="pane-controls">
            <select id="cam-select-1" class="media-select" aria-label="REPOS 01 Camera">
              <option value="">Camera</option>
            </select>
            <select id="mic-select-1" class="media-select" aria-label="REPOS 01 Microphone">
              <option value="">Microphone</option>
            </select>
          </div>
        </div>
        <div class="iframe-container">
          <iframe id="iframe-face" class="feed-iframe" src="http://127.0.0.1:8088/?embedded=true" scrolling="no"
            allow="camera; microphone"></iframe>
        </div>
      </div>

      <!-- Top-Right Pane (60% width): REPOS 02 -->
      <div class="pane-card top-right-pane">
        <div class="pane-header">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
              <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
              <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
              <path
                d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15">
              </path>
            </svg>
            REPOS 02
          </div>
          <div class="pane-controls">
            <select id="cam-select-2" class="media-select" aria-label="REPOS 02 Camera">
              <option value="">Camera</option>
            </select>
            <select id="mic-select-2" class="media-select" aria-label="REPOS 02 Microphone">
              <option value="">Microphone</option>
            </select>
          </div>
        </div>
        <div class="iframe-container">
          <iframe id="iframe-point" class="feed-iframe" src="http://127.0.0.1:5173/?embedded=true" scrolling="no"
            allow="camera; microphone"></iframe>
        </div>
      </div>
    </div>

    <!-- BOTTOM PANE (FULL WIDTH): ACTIVE TARGET & DIALOGUE CONSOLE -->
    <div class="bottom-pane">
      <!-- Minimal Single Active Target Display -->
      <div id="active-target-bar" class="active-target-bar" style="display: none;">
        <div class="active-target-badge">
          <span class="active-target-dot"></span>
          <span id="active-target-name" class="active-target-name"></span>
          <span id="active-target-tag" class="active-target-tag"></span>
          <span class="active-target-status">[LATCHED]</span>
        </div>
      </div>

      <!-- Real-Time Dialogue Console & Telemetry Feed -->
      <div id="terminal-body" class="terminal-body">
        <div class="status-pill-row">
          <div class="dialogue-pill pill-system">
            <span class="pill-dot"></span>
            <span>[REPOS] Initialized • Standby</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- DIALOGUE STREAM, MEDIA SELECTORS & IPC CLIENT SCRIPT -->
  <script>
    const termBody = document.getElementById('terminal-body');
    const activeTargetBar = document.getElementById('active-target-bar');
    const activeTargetName = document.getElementById('active-target-name');
    const activeTargetTag = document.getElementById('active-target-tag');

    // Auto-scroll is permanently active in the background
    const autoScrollEnabled = true;

    function getFormattedTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function cleanScroll() {
      if (!termBody) return;
      while (termBody.children.length > 250) {
        termBody.removeChild(termBody.firstChild);
      }
      if (autoScrollEnabled) {
        termBody.scrollTop = termBody.scrollHeight;
      }
    }

    // HARDWARE TARGET METADATA
    const BOARD_SPECS = {
      esp32: { name: 'ESP32-S3 DevKit', tag: 'Dual-Core Xtensa LX7' },
      jetson: { name: 'NVIDIA Jetson Orin Nano', tag: '40 TOPS Ampere GPU' },
      orin: { name: 'NVIDIA Jetson Orin Nano', tag: '40 TOPS Ampere GPU' },
      stm32: { name: 'STM32 Nucleo-F446RE', tag: 'ARM Cortex-M4 @ 180MHz' },
      nucleo: { name: 'STM32 Nucleo-F446RE', tag: 'ARM Cortex-M4 @ 180MHz' },
      arduino: { name: 'Arduino Uno Rev4', tag: 'Renesas RA4M1 32-bit' },
      uno: { name: 'Arduino Uno Rev4', tag: 'Renesas RA4M1 32-bit' }
    };

    let currentLatchedBoardKey = null;

    function updateHardwareFocus(boardKey) {
      if (!boardKey || !String(boardKey).trim()) {
        return;
      }

      const key = String(boardKey).toLowerCase();
      let matchedSpec = null;
      if (key.includes('esp32')) matchedSpec = BOARD_SPECS.esp32;
      else if (key.includes('jetson') || key.includes('orin')) matchedSpec = BOARD_SPECS.jetson;
      else if (key.includes('stm32') || key.includes('nucleo')) matchedSpec = BOARD_SPECS.stm32;
      else if (key.includes('arduino') || key.includes('uno')) matchedSpec = BOARD_SPECS.arduino;
      else {
        matchedSpec = { name: boardKey, tag: '' };
      }

      if (matchedSpec && activeTargetBar && activeTargetName && activeTargetTag) {
        currentLatchedBoardKey = key;
        activeTargetName.textContent = matchedSpec.name;
        activeTargetTag.textContent = matchedSpec.tag;
        activeTargetTag.style.display = matchedSpec.tag ? 'inline' : 'none';
        activeTargetBar.style.display = 'flex';
      }
    }

    // STREAMING TOKEN ACCUMULATOR
    function handleStreamChunk(role, chunk) {
      if (!chunk || !chunk.trim()) return;
      let activeBubble = termBody.querySelector('.dialogue-msg.msg-repos.streaming-active');
      if (!activeBubble) {
        activeBubble = document.createElement('div');
        activeBubble.className = 'dialogue-msg msg-repos streaming-active';
        activeBubble.innerHTML = `
          <div class="msg-header">
            <span class="msg-sender-tag">[REPOS]</span>
            <span class="msg-time">${getFormattedTime()}</span>
          </div>
          <div class="msg-body"></div>
        `;
        termBody.appendChild(activeBubble);
      }
      const bodyEl = activeBubble.querySelector('.msg-body');
      bodyEl.innerText += (bodyEl.innerText ? ' ' : '') + chunk;
      cleanScroll();
    }

    // SANITIZE LEGACY TECHNICAL & SUBSYSTEM LABELS
    function sanitizeLegacyLabels(text) {
      if (!text) return '';
      let res = String(text);
      res = res.replace(/JARVIS|Jarvis|jarvis/g, 'REPOS');
      res = res.replace(/AeroFinger|aerofinger|Arrowfinger/gi, 'REPOS 02');
      res = res.replace(/Face Cam|Facecam/gi, 'REPOS 01');
      res = res.replace(/Hardware Lab|Native 3-in-1 Shell/gi, 'REPOS');
      res = res.replace(/YuNet \+ SFace|YuNet|SFace|MediaPipe 3D|MediaPipe/gi, 'REPOS');
      return res;
    }

    // FORMATTED DIALOGUE & STATUS EVENT PRINTER
    function appendDialogueMessage(role, text) {
      if (!text || !text.trim() || !termBody) return;
      const rawText = text.trim();

      // STRICT NOISE FILTER
      const noisePatterns = [
        "POST /api", "GET /api", "GET /", "OPTIONS /", "HTTP/1.", "200 OK", "404 Not Found",
        "terminal_log", "recognize_frame", "presence_state", "WebSocket", "connection_lost",
        "INFO:", "DEBUG:", "WARNING:", "heartbeat", "multipart/form-data", "piping", "Uvicorn running"
      ];
      if (noisePatterns.some(n => rawText.includes(n)) &&
        !rawText.includes("[YOU]:") && !rawText.includes("[USER]:") &&
        !rawText.includes("[JARVIS]:") && !rawText.includes("[AGENT]:") &&
        !rawText.includes("[REPOS]:") && !rawText.includes("[STATUS") &&
        !rawText.includes("[HARDWARE]") && !rawText.includes("[FOCUS]") &&
        !rawText.includes("[WAKE WORD")) {
        return;
      }

      const upperRole = (role || '').toUpperCase();

      // 1. HARDWARE LATCH / FOCUS EVENT
      if (upperRole === 'FOCUS' || rawText.includes('[HARDWARE]') || rawText.includes('[FOCUS]')) {
        let boardName = text;
        if (text.includes('to:')) boardName = text.split('to:')[1].trim();
        else if (text.includes('locked:')) boardName = text.split('locked:')[1].trim();
        else if (text.includes(':')) boardName = text.split(':')[1].trim();
        boardName = boardName.replace(/[\[\]]/g, '').trim();

        updateHardwareFocus(boardName);

        const pillRow = document.createElement('div');
        pillRow.className = 'status-pill-row';
        pillRow.innerHTML = `
          <div class="dialogue-pill pill-target">
            <span class="pill-dot"></span>
            <span>[REPOS] TARGET: ${escapeHtml(boardName)}</span>
          </div>
        `;
        termBody.appendChild(pillRow);
        cleanScroll();
        return;
      }

      // 2. STATE TRANSITIONS
      if (upperRole === 'STATE' || rawText.startsWith('[STATUS') || rawText.includes('[STATUS:')) {
        let stateVal = 'ACTIVE';
        if (rawText.toLowerCase().includes('listening')) stateVal = 'LISTENING';
        else if (rawText.toLowerCase().includes('speaking')) stateVal = 'SPEAKING';
        else if (rawText.toLowerCase().includes('thinking')) stateVal = 'THINKING';
        else if (rawText.toLowerCase().includes('sleeping') || rawText.toLowerCase().includes('standby')) stateVal = 'SLEEPING';
        else if (rawText.toLowerCase().includes('active')) stateVal = 'ACTIVE';

        const pillRow = document.createElement('div');
        pillRow.className = 'status-pill-row';
        const pillClass = stateVal.toLowerCase();
        pillRow.innerHTML = `
          <div class="dialogue-pill pill-${pillClass}">
            <span class="pill-dot"></span>
            <span>[REPOS] [${stateVal.toUpperCase()}]</span>
          </div>
        `;
        termBody.appendChild(pillRow);
        cleanScroll();
        return;
      }

      // 3. WAKE WORD DETECTED
      if (rawText.includes('[WAKE WORD')) {
        const pillRow = document.createElement('div');
        pillRow.className = 'status-pill-row';
        pillRow.innerHTML = `
          <div class="dialogue-pill pill-listening">
            <span class="pill-dot"></span>
            <span>[REPOS] [WAKE TRIGGER]</span>
          </div>
        `;
        termBody.appendChild(pillRow);
        cleanScroll();
        return;
      }

      // 4. USER SPEECH
      if (upperRole === 'USER' || upperRole === 'YOU' || rawText.startsWith('[USER]:') || rawText.startsWith('[YOU]:')) {
        let cleanContent = rawText;
        if (cleanContent.startsWith('[USER]:')) cleanContent = cleanContent.slice(7).trim();
        else if (cleanContent.startsWith('[YOU]:')) cleanContent = cleanContent.slice(6).trim();

        const msgCard = document.createElement('div');
        msgCard.className = 'dialogue-msg msg-user';
        msgCard.innerHTML = `
          <div class="msg-header">
            <span class="msg-sender-tag">[USER]</span>
            <span class="msg-time">${getFormattedTime()}</span>
          </div>
          <div class="msg-body">${escapeHtml(cleanContent)}</div>
        `;
        termBody.appendChild(msgCard);
        cleanScroll();
        return;
      }

      // 5. REPOS SPEECH
      if (upperRole === 'JARVIS' || upperRole === 'AGENT' || upperRole === 'REPOS' ||
          rawText.startsWith('[JARVIS]:') || rawText.startsWith('[AGENT]:') ||
          rawText.startsWith('[AGENT STREAMING]:') || rawText.startsWith('[REPOS]:')) {
        let cleanContent = rawText;
        if (cleanContent.includes(']:')) cleanContent = cleanContent.split(']:')[1].trim().replace(/^"/, '').replace(/"$/, '');
        cleanContent = sanitizeLegacyLabels(cleanContent);

        // If a streaming bubble was open, finish it with full content
        const activeBubble = termBody.querySelector('.dialogue-msg.msg-repos.streaming-active');
        if (activeBubble) {
          activeBubble.classList.remove('streaming-active');
          activeBubble.querySelector('.msg-body').innerText = cleanContent;
          cleanScroll();
          return;
        }

        const msgCard = document.createElement('div');
        msgCard.className = 'dialogue-msg msg-repos';
        msgCard.innerHTML = `
          <div class="msg-header">
            <span class="msg-sender-tag">[REPOS]</span>
            <span class="msg-time">${getFormattedTime()}</span>
          </div>
          <div class="msg-body">${escapeHtml(cleanContent)}</div>
        `;
        termBody.appendChild(msgCard);
        cleanScroll();
        return;
      }

      // 6. GENERAL TELEMETRY / SYSTEM NOTICE
      let sanitizedNotice = sanitizeLegacyLabels(rawText);
      if (!sanitizedNotice.startsWith('[REPOS]') && !sanitizedNotice.startsWith('[')) {
        sanitizedNotice = `[REPOS] ${sanitizedNotice}`;
      }
      const pillRow = document.createElement('div');
      pillRow.className = 'status-pill-row';
      pillRow.innerHTML = `
        <div class="dialogue-pill pill-system">
          <span class="pill-dot"></span>
          <span>${escapeHtml(sanitizedNotice)}</span>
        </div>
      `;
      termBody.appendChild(pillRow);
      cleanScroll();
    }

    // DECOUPLED MEDIA DEVICE ENUMERATION & SYNCHRONIZATION
    async function syncMediaSelectors() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return;
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const camSelectors = [document.getElementById('cam-select-1'), document.getElementById('cam-select-2')];
        const micSelectors = [document.getElementById('mic-select-1'), document.getElementById('mic-select-2')];

        camSelectors.forEach(select => {
          if (!select) return;
          const currentVal = select.value;
          select.innerHTML = '<option value="">Camera</option>';
          devices.filter(d => d.kind === 'videoinput').forEach((d, idx) => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.textContent = d.label || `Camera ${idx + 1}`;
            select.appendChild(opt);
          });
          if (currentVal) select.value = currentVal;
        });

        micSelectors.forEach(select => {
          if (!select) return;
          const currentVal = select.value;
          select.innerHTML = '<option value="">Microphone</option>';
          devices.filter(d => d.kind === 'audioinput').forEach((d, idx) => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.textContent = d.label || `Microphone ${idx + 1}`;
            select.appendChild(opt);
          });
          if (currentVal) select.value = currentVal;
        });
      } catch (err) {
        console.error("Device enumeration failed:", err);
      }
    }

    // WIRE CHANGE LISTENERS FOR DEVICE DROPDOWNS
    function initDeviceSelectors() {
      const cam1 = document.getElementById('cam-select-1');
      const mic1 = document.getElementById('mic-select-1');
      const cam2 = document.getElementById('cam-select-2');
      const mic2 = document.getElementById('mic-select-2');
      const iframe1 = document.getElementById('iframe-face');
      const iframe2 = document.getElementById('iframe-point');

      function notifyIframe(iframe, kind, deviceId) {
        if (!iframe) return;
        try {
          iframe.contentWindow?.postMessage({
            type: 'REPOS_MEDIA_SELECT',
            kind: kind,
            deviceId: deviceId
          }, '*');
        } catch (e) {
          console.warn("Could not postMessage to iframe:", e);
        }
      }

      if (cam1) cam1.addEventListener('change', (e) => notifyIframe(iframe1, 'videoinput', e.target.value));
      if (mic1) mic1.addEventListener('change', (e) => notifyIframe(iframe1, 'audioinput', e.target.value));
      if (cam2) cam2.addEventListener('change', (e) => notifyIframe(iframe2, 'videoinput', e.target.value));
      if (mic2) mic2.addEventListener('change', (e) => notifyIframe(iframe2, 'audioinput', e.target.value));

      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', syncMediaSelectors);
      }
    }

    // ATTEMPT TO INJECT STYLES TO SUPPRESS EMBEDDED IFRAME OVERLAYS IF PERMISSIBLE
    function setupIframeOverlaySuppression() {
      const iframeFace = document.getElementById('iframe-face');
      if (iframeFace) {
        iframeFace.addEventListener('load', () => {
          try {
            const doc = iframeFace.contentDocument || iframeFace.contentWindow.document;
            if (doc) {
              const style = doc.createElement('style');
              style.textContent = '.kiosk-badge, #kioskBadge, .hud-overlay-text, #hudFps { display: none !important; opacity: 0 !important; visibility: hidden !important; }';
              doc.head.appendChild(style);
            }
          } catch (e) {
            // Handled via cross-origin isolation
          }
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncMediaSelectors();
      initDeviceSelectors();
      setupIframeOverlaySuppression();
    });

    // SSE TELEMETRY STREAM CONNECTION
    let evtSource = null;
    function connectTerminalStream() {
      const streamUrl = 'http://127.0.0.1:8088/terminal_stream';
      evtSource = new EventSource(streamUrl);

      evtSource.onopen = () => {
        appendDialogueMessage('SYSTEM', `[REPOS] Telemetry stream connected (:8088)`);
      };

      evtSource.onmessage = (event) => {
        try {
          if (!event.data || event.data.trim() === ': ping') return;
          const data = JSON.parse(event.data);

          if (data.type === 'state') {
            // State events recorded as minimal telemetry badge in dialogue stream
            if (data.state) appendDialogueMessage('STATE', data.state);
          } else if (data.type === 'focus') {
            if (data.board) {
              updateHardwareFocus(data.board);
              appendDialogueMessage('FOCUS', data.board);
            } else if (data.text) {
              appendDialogueMessage('FOCUS', data.text);
            }
          } else if (data.type === 'transcript') {
            appendDialogueMessage(data.role, data.text);
          } else if (data.type === 'stream_chunk') {
            handleStreamChunk(data.role, data.chunk);
          } else if (data.type === 'log') {
            appendDialogueMessage('SYSTEM', data.text);
          }
        } catch (err) {
          appendDialogueMessage('SYSTEM', event.data);
        }
      };

      evtSource.onerror = (err) => {
        evtSource.close();
        setTimeout(connectTerminalStream, 2000);
      };
    }

    connectTerminalStream();
  </script>
