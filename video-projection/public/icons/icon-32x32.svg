<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="url(#bg)" rx="4.8"/>
  
  <!-- Iron Man Arc Reactor Style Circle -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="url(#accent)" stroke-width="0.64" opacity="0.8"/>
  <circle cx="16" cy="16" r="4.8" fill="none" stroke="url(#accent)" stroke-width="0.48" opacity="0.6"/>
  <circle cx="16" cy="16" r="2.56" fill="url(#accent)" opacity="0.9"/>
  
  <!-- Video Play Symbol -->
  <polygon points="14.4,12.8 14.4,19.2 19.2,16" fill="white" opacity="0.9"/>
  
  <!-- Decorative Elements -->
  <circle cx="6.4" cy="6.4" r="0.64" fill="url(#accent)" opacity="0.7"/>
  <circle cx="25.6" cy="6.4" r="0.64" fill="url(#accent)" opacity="0.7"/>
  <circle cx="6.4" cy="25.6" r="0.64" fill="url(#accent)" opacity="0.7"/>
  <circle cx="25.6" cy="25.6" r="0.64" fill="url(#accent)" opacity="0.7"/>
</svg>