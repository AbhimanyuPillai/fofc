<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="16" height="16" fill="url(#bg)" rx="2.4"/>
  
  <!-- Iron Man Arc Reactor Style Circle -->
  <circle cx="8" cy="8" r="4" fill="none" stroke="url(#accent)" stroke-width="0.32" opacity="0.8"/>
  <circle cx="8" cy="8" r="2.4" fill="none" stroke="url(#accent)" stroke-width="0.24" opacity="0.6"/>
  <circle cx="8" cy="8" r="1.28" fill="url(#accent)" opacity="0.9"/>
  
  <!-- Video Play Symbol -->
  <polygon points="7.2,6.4 7.2,9.6 9.6,8" fill="white" opacity="0.9"/>
  
  <!-- Decorative Elements -->
  <circle cx="3.2" cy="3.2" r="0.32" fill="url(#accent)" opacity="0.7"/>
  <circle cx="12.8" cy="3.2" r="0.32" fill="url(#accent)" opacity="0.7"/>
  <circle cx="3.2" cy="12.8" r="0.32" fill="url(#accent)" opacity="0.7"/>
  <circle cx="12.8" cy="12.8" r="0.32" fill="url(#accent)" opacity="0.7"/>
</svg>